<!DOCTYPE html>
<html>
<head>
  <style>
    body { 
      width: 480px; 
      padding: 16px 16px 0; 
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif; 
      margin: 0;
      background: #f8f9fa;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 16px;
    }
    .header img {
      width: 28px;
      height: 28px;
      border-radius: 6px;
    }
    h2 { 
      margin: 0; 
      color: #1e3a8a;
    }

    .input-wrap {
      position: relative;
      margin-bottom: 12px;
    }

    input { 
      padding: 12px 44px 12px 14px; 
      width: 100%; 
      font-size: 16px; 
      border: 2px solid #ddd; 
      border-radius: 8px; 
      box-sizing: border-box;
    }
    button.primary-btn { 
      padding: 13px; 
      width: 100%; 
      font-size: 15px; 
      font-weight: 600; 
      border: none; 
      border-radius: 8px; 
      cursor: pointer; 
      margin: 6px 0;
      background: #1e3a8a; 
      color: white;
    }
    button.primary-btn:hover { 
      background: #2e5bcc; 
    }

    .clear-btn {
      position: absolute;
      top: 50%;
      right: 8px;
      width: 28px;
      height: 28px;
      transform: translateY(-50%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      font-size: 20px;
      line-height: 1;
      background: transparent;
      color: #666;
      border: none;
      border-radius: 50%;
      cursor: pointer;
    }
    .clear-btn:hover {
      background: #e9ecef;
      color: #1f2937;
    }
    .clear-btn:focus-visible {
      outline: 2px solid #1e3a8a;
      outline-offset: 2px;
    }

    .filing { 
      margin: 14px 0; 
      padding: 16px; 
      background: white; 
      border-radius: 10px; 
      border-left: 6px solid #1e3a8a; 
      box-shadow: 0 3px 6px rgba(0,0,0,0.08);
    }
    .filing-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .filing button {
      padding: 12px 16px;
      width: 100%;
      font-size: 15px;
      font-weight: 600;
      background: #1e3a8a;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
    .filing button:hover {
      background: #2e5bcc;
    }
    .filing button.download-btn {
      background: #0f766e;
    }
    .filing button.download-btn:hover {
      background: #0d9488;
    }
    .year-header {
      margin: 24px 0 12px 0;
      font-size: 18px;
      font-weight: bold;
      color: #1e3a8a;
    }

    .footer {
      position: sticky;
      bottom: 0;
      z-index: 2;
      margin: 25px -16px 0;
      padding: 10px 16px 12px;
      border-top: 1px solid #ddd;
      text-align: center;
      font-size: 12px;
      color: #666;
      line-height: 1.4;
      background: #f8f9fa;
      box-shadow: 0 -4px 10px rgba(0,0,0,0.04);
    }
    .footer a {
      color: #1e3a8a;
      text-decoration: none;
    }
    .footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="header">
    <img src="icons/icon48.png" alt="SECFetcher">
    <h2>SECFetcher</h2>
  </div>

  <div class="input-wrap">
    <input type="text" id="ticker" placeholder="Enter Ticker (e.g. NVDA, AAPL, TSLA)" />
    <button id="clear-results" class="clear-btn" type="button" aria-label="Clear ticker and results" title="Clear ticker and results">&times;</button>
  </div>

  <button id="fetch-10kq" class="primary-btn">10-K & 10-Q Filings</button>
  <button id="fetch-8k" class="primary-btn">8-K (Material Events)</button>
  <button id="fetch-proxy" class="primary-btn">Proxy Statement (DEF 14A)</button>

  <div id="results"></div>

  <div class="footer">
    Made by jishangiras<br>
    <a href="https://www.buymeacoffee.com/jishangiras" target="_blank">Buy me a coffee</a> | 
    Thank you!
  </div>

  <script src="popup.js"></script>
</body>
</html>
